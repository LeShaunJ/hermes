name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a PR receives a new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true

      - name: gofmt -l .
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files need 'gofmt -s -w':"
            echo "$out"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --output.text.path=stdout --output.text.colors=true --output.junit-xml.path=golangci.xml

      - name: publish lint annotations
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: golangci.xml
          check_name: lint
          require_tests: false
          annotate_only: true

  test:
    name: Units & Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true

      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: go test -race -cover
        shell: bash
        run: |
          set -o pipefail
          gotestsum --junitfile=unit.xml --format=pkgname -- \
            -race -count=1 -cover ./... | tee cover.log

      - name: enforce per-package coverage ≥ 80%
        shell: bash
        run: |
          awk '/^ok/ && /coverage:/ {
            for (i=1; i<=NF; i++) if ($i == "coverage:") {
              pct=$(i+1); gsub("%","",pct)
              if (pct+0 < 80) { print "FAIL (<80%): " $0; fail=1 }
            }
          } END { exit fail }' cover.log

      - name: publish unit test annotations
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: unit.xml
          check_name: unit
          annotate_only: true

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    # GitHub's ubuntu-24.04 runners ship with Docker pre-installed and
    # the daemon running, so testcontainers-go's postgres module can
    # pull postgres:16-alpine on demand.  No extra setup required.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true

      - name: install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: go test -tags e2e
        run: gotestsum --junitfile=e2e.xml --format=pkgname -- -tags e2e -count=1 ./test/e2e/...

      - name: publish e2e test annotations
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: e2e.xml
          check_name: e2e
          annotate_only: true
