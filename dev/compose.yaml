---
name: hermes-dev

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── hermes (gateway) ─────────────────────────────────────────────────────────
  hermes:
    privileged: true
    build:
      context: ..
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hermes.yaml:/etc/hermes.yaml:ro

  # ── hermes (operator UI) ─────────────────────────────────────────────────────
  hermes-ui:
    build:
      context: ..
      dockerfile: Containerfile
    command: ["ui"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./hermes.yaml:/etc/hermes.yaml:ro

  # ── nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
      hermes-ui:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./headers.js:/etc/nginx/headers.js:ro
    ports:
      - "8888:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
...
