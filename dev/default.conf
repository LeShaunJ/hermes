map $request_uri $loggable {
    ~*^/healthz  0;
    default      1;
}

server {
    listen 80;
    server_name _;

    # Operator UI — strip the /ui prefix so the upstream sees its own
    # canonical paths (/, /images, /events, /static/...). Disable
    # buffering so SSE messages flush in real time.
    location /ui/ {
        access_log  /var/log/nginx/access.log  json_access if=$loggable;

        rewrite     ^/ui(/.*)$ $1 break;
        proxy_pass  http://hermes-ui:8090;

        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 1h;

        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;
    }

    location / {
        access_log  /var/log/nginx/access.log  json_access if=$loggable;

        server_tokens off;

        proxy_pass  http://hermes:8080;

        proxy_ssl_server_name on;

        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;
    }
}
