# dev/nginx.conf — nginx configuration for the hermes dev stack
#
# This file is mounted at /etc/nginx/conf.d/hermes.conf inside the nginx
# container.  It configures nginx to:
#
#   1. Accept OCI Distribution API requests with the registry embedded in the
#      path:  GET /<registry>/v2/<repo>/manifests/<tag>
#   2. Use hermes as an auth_request sub-request to check approval.
#   3. On success, proxy_pass to the URI returned in X-Hermes-Image-Uri.
#
# Usage with a container runtime (e.g. Docker):
#
#   docker pull myapp:latest via nginx:
#
#     DOCKER_HOST=tcp://nginx.dev:8888 docker pull \
#       registry.example.com/myapp:latest
#
#   which translates to:
#
#     GET /registry.example.com/v2/myapp/manifests/latest
#
#   nginx → hermes validate → registry.example.com (if approved)

server {
    listen 80;
    server_name _;

    # ── OCI registry proxy ───────────────────────────────────────────────────
    #
    # Matches:  /<registry>/v2/<repo>/manifests/<tag>
    #           /<registry>/v2/<repo>/blobs/<digest>
    # (and any other Distribution API sub-paths)
    #
    location ~ ^/(?<registry>[^/]+)/(?<distpath>v2/.+)$ {

        # Ask hermes whether this image is approved.
        auth_request     /hermes-validate/$registry/$distpath;

        # Capture the approved image URI from hermes response headers.
        auth_request_set $hermes_image_uri $upstream_http_x_hermes_image_uri;

        # Proxy to the upstream registry using the URI hermes provides.
        # For manifest requests hermes returns the pinned digest URI; for blob
        # requests it returns the original path unchanged.
        #
        # NOTE: nginx variable interpolation requires a resolver for DNS.
        resolver         127.0.0.11 valid=10s;
        proxy_pass       https://$hermes_image_uri;

        proxy_ssl_server_name on;
        proxy_set_header  Host              $registry;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }

    # ── hermes validation sub-request (internal) ─────────────────────────────
    #
    # nginx forwards the full path to hermes so it can parse the registry,
    # repo, and tag.  The leading /hermes-validate/ is stripped and replaced
    # with /validate/ before forwarding.
    #
    location /hermes-validate/ {
        internal;

        # Rewrite /hermes-validate/<registry>/v2/... → /validate/<registry>/v2/...
        rewrite ^/hermes-validate/(.*)$ /validate/$1 break;

        proxy_pass              http://hermes:8080;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length   "";
        proxy_set_header        X-Original-URI   $request_uri;
        proxy_set_header        X-Real-IP        $remote_addr;
    }

    # ── health check ─────────────────────────────────────────────────────────
    location = /healthz {
        proxy_pass http://hermes:8080/healthz;
    }
}
