# yaml-language-server: $schema=../docs/hermes.schema.json
server:
  addr: ":8080"
  url: http://localhost:8888

ui:
  addr: ":8090"
  url: http://localhost:8888/ui
  # base_path is inferred from ui.url's path ("/ui").  Set explicitly to
  # override, or leave unset when the UI is served at the listener's root.
  # base_path: "/ui"

db:
  host: postgres
  port: 5432
  user: hermes
  password: hermes
  name: hermes
  sslmode: disable

trivy:
  image: aquasec/trivy:0.69.3
  # args: []           # extra flags for `trivy image`
  # convert_args: []   # extra flags for `trivy convert`

# cache_url: ""        # default cache registry for `hermes approve --cache`
