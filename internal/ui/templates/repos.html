{{define "content"}}
<section class="repos">
  <h1>Repositories</h1>
  <p class="muted">Click a row to expand its tag-sets and per-platform images.</p>

  <table class="images tree">
    <thead>
      <tr>
        <th>repository / tag(s) / platform</th>
        <th>digest</th>
        <th>state</th>
        <th>updated</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {{range .Tree}}{{template "_repo_row.html" .}}{{end}}
      {{if not .Tree}}<tr><td colspan="5" class="muted">no repositories tracked yet</td></tr>{{end}}
    </tbody>
  </table>
</section>
{{end}}
