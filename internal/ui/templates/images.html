{{define "content"}}
{{$selected := ""}}{{if .StateTokens}}{{$selected = index .StateTokens 0}}{{end}}
<section class="images">
  <h1>Images</h1>

  <form class="filters" method="get" action="{{base}}/images"
        hx-get="{{base}}/images" hx-target="#image-rows" hx-trigger="change, submit"
        hx-headers='{"Hx-Target": "image-rows"}' hx-push-url="true">
    <label>state
      <select name="state">
        <option value=""          {{if eq $selected ""}}selected{{end}}>all</option>
        <option value="pending"   {{if eq $selected "pending"}}selected{{end}}>pending</option>
        <option value="verified"  {{if eq $selected "verified"}}selected{{end}}>verified</option>
        <option value="queued"    {{if eq $selected "queued"}}selected{{end}}>queued</option>
        <option value="scanned"   {{if eq $selected "scanned"}}selected{{end}}>scanned</option>
        <option value="approved"  {{if eq $selected "approved"}}selected{{end}}>approved</option>
        <option value="rejected"  {{if eq $selected "rejected"}}selected{{end}}>rejected</option>
        <option value="rescinded" {{if eq $selected "rescinded"}}selected{{end}}>rescinded</option>
        <option value="voided"    {{if eq $selected "voided"}}selected{{end}}>voided</option>
        <option value="errored"   {{if eq $selected "errored"}}selected{{end}}>errored</option>
      </select>
    </label>
    <label>os <input type="text" name="os" value="{{.Filter.OS}}" placeholder="linux"></label>
    <label>arch <input type="text" name="arch" value="{{.Filter.Arch}}" placeholder="amd64"></label>
    <label>ref <input type="text" name="ref" value="{{.RefFilter}}" placeholder="myorg/myapp:v1"></label>
    <button type="submit">filter</button>
  </form>

  <table class="images">
    <thead>
      <tr>
        <th>state</th>
        <th>image</th>
        <th>platform</th>
        <th>digest</th>
        <th>updated</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="image-rows">
      {{template "_rows.html" .}}
    </tbody>
  </table>
</section>
{{end}}
