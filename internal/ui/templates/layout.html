{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · hermes</title>
  <link rel="icon" href="{{base}}/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{base}}/static/hermes.css">
  <script src="{{base}}/static/htmx.min.js" defer></script>
</head>
<body hx-ext="sse" sse-connect="{{base}}/events">
  <header class="topbar">
    <div class="brand"><a href="{{base}}/">hermes</a></div>
    <nav>
      <a href="{{base}}/">Dashboard</a>
      <a href="{{base}}/images">Images</a>
      <a href="{{base}}/images?state=pending">Pending</a>
      <a href="{{base}}/images?state=verified">Verified</a>
    </nav>
    <div class="live" title="live event feed">
      <span class="dot"></span>
      <span sse-swap="event" hx-swap="innerHTML">idle</span>
    </div>
  </header>
  <main>
    {{template "content" .}}
  </main>
  <footer>hermes operator console · pre-alpha · authentication is the responsibility of an upstream proxy</footer>
</body>
</html>{{end}}
